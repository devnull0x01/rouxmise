<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rouxmise</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="header-inner">
            <svg class="logo" onclick="showView('browse')" viewBox="0 0 260 50" width="260" height="50" role="img" style="cursor:pointer;" xmlns="http://www.w3.org/2000/svg">
                <title>Rouxmise</title>
                <g transform="translate(22, 25)">
                    <rect x="-18" y="-22" width="36" height="36" rx="3" fill="none" stroke="#c8a96e" stroke-width="1.5"/>
                    <text x="0" y="12" font-size="26" font-family="Georgia, serif" fill="#c8a96e" text-anchor="middle">R</text>
                </g>
                <text x="50" y="22" font-size="22" font-family="Georgia, serif" fill="#c8a96e" letter-spacing="1">Rouxmise</text>
                <line x1="50" y1="27" x2="224" y2="27" stroke="#c8a96e" stroke-width="0.5" opacity="0.5"/>
                <text x="50" y="40" font-size="8" font-family="Georgia, serif" fill="#888" letter-spacing="4">RECIPE COLLECTION</text>
            </svg>
            <nav>
                <button onclick="showView('browse')">Browse</button>
                <button onclick="showView('form')">Add Recipe</button>
            </nav>
        </div>
    </header>

    <main id="app">

        <!-- BROWSE VIEW -->
        <div id="view-browse" class="view">
            <div class="browse-controls">
                <input type="text" id="search-input" placeholder="Search recipes..." oninput="handleSearch()">
                <select id="category-filter" onchange="handleSearch()">
                    <option value="">All Categories</option>
                    <option>Breakfast</option>
                    <option>Lunch</option>
                    <option>Dinner</option>
                    <option>Dessert</option>
                    <option>Snack</option>
                    <option>Drink</option>
                    <option>Other</option>
                </select>
            </div>
            <div id="recipe-grid" class="recipe-grid"></div>
        </div>

        <!-- VIEW RECIPE -->
        <div id="view-recipe" class="view hidden">
            <div class="recipe-actions">
                <button onclick="showView('browse')">← Back</button>
                <button onclick="editCurrentRecipe()">Edit</button>
                <button onclick="deleteCurrentRecipe()" class="btn-danger">Delete</button>

                <!--
                # === MODIFIED 20260426 ===
                # PRINT SHOPPING LIST FOR RECIPE IMMEDIATELY
                # INSTEAD OF SHOWING THE LIST OF INGREDIENTS AND THEN
                # PRINTING THE LIST 
                <button onclick="showShoppingList()">Shopping List</button>
                -->
                <button onclick="printShoppingList()">Print Shopping List</button>
                <!--
                # === MODIFIED STOP ===
                -->
                
                <button onclick="printCard()">Print Card</button>
            </div>
            <div id="recipe-detail"></div>
        </div>

        <!-- ADD / EDIT VIEW -->
        <div id="view-form" class="view hidden">
            <div class="form-container">
                <h2 id="form-title">Add Recipe</h2>
                <div class="form-group">
                    <label for="f-name">Recipe Name *</label>
                    <input type="text" id="f-name" placeholder="e.g. Chicken Tikka Masala">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="f-category">Category</label>
                        <select id="f-category">
                            <option>Breakfast</option>
                            <option>Lunch</option>
                            <option>Dinner</option>
                            <option>Dessert</option>
                            <option>Snack</option>
                            <option>Drink</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="f-servings">Servings</label>
                        <input type="text" id="f-servings" placeholder="e.g. 4 servings">
                    </div>
                </div>
                <div class="form-group">
                    <label for="f-ingredients">Ingredients <span class="hint">(one per line)</span></label>
                    <textarea id="f-ingredients" rows="10" placeholder="2 cups flour&#10;1 tsp salt&#10;3 eggs"></textarea>
                </div>
                <div class="form-group">
                    <label for="f-instructions">Instructions</label>
                    <textarea id="f-instructions" rows="12" placeholder="1. Preheat oven to 350°F&#10;2. Mix dry ingredients..."></textarea>
                </div>
                <div class="form-group">
                    <label for="f-notes">Notes <span class="hint">(optional)</span></label>
                    <textarea id="f-notes" rows="4" placeholder="Doubles well, freezes great..."></textarea>
                </div>
                <div class="form-actions">
                    <button onclick="showView('browse')" class="btn-secondary">Cancel</button>
                    <button onclick="saveRecipe()" class="btn-primary">Save Recipe</button>
                </div>
            </div>
        </div>

        

    </main>

    <!-- PRINT CARD (hidden, shown only on print) -->
    <div id="print-card" class="hidden"></div>

    <script src="js/app.js"></script>
</body>
</html>
